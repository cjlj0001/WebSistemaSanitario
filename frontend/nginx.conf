server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50M;
  
  # Google Identity Services uses a cross-origin popup and postMessage.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # Frontend
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Backend routes. Keep the original path: some routers use /api while the
  # image and authentication routers intentionally live at the root.
  location ~ ^/(api|auth|medicalImages)(/|$) {
    proxy_pass http://backend-wss:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
